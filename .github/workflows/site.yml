# SPDX-License-Identifier: AGPL-3.0-or-later
# Build the Conjecture website (site/) with the biophoton pack's run panel
# and deploy it to GitHub Pages. Manual only: publishing is an explicit
# decision, so this never runs on push.
#
# The OSF webfonts (Selecta, ABC Diatype Semi Mono) are owned by the Open
# Science Foundation and never committed: the build fetches them from the
# foundation's own site (repository variable OSF_FONTS_BASE, default
# https://opening.science/fonts/) and serves them from this one.
name: site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Opening-Science/conjecture-pack-biophotons
          path: pack
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Site data and the pack's read-only run panel
        run: python site/scripts/hub-data.py
        env:
          CONJECTURE_PACK: ${{ github.workspace }}/pack/pack.yaml
      - name: OSF webfonts, from the foundation's site
        env:
          BASE: ${{ vars.OSF_FONTS_BASE || 'https://opening.science/fonts/' }}
        run: |
          for f in Selecta-Regular Selecta-Medium Selecta-Bold \
                   ABCDiatypeSemiMono-Regular ABCDiatypeSemiMono-Bold; do
            curl -fsSL "${BASE}${f}.woff2" -o "site/public/fonts/${f}.woff2"
          done
          ls -la site/public/fonts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Checks and static build
        working-directory: site
        run: |
          npm ci
          npm run design:check
          npm run design:tokens:check
          npm test
          npm run typecheck
          npm run generate
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
