contract: 1
kind: engine
name: codex-mcp
title: Codex, single agent + corpus over MCP
summary: >-
  codex-solo with the corpus served by mcp_server.py instead of a shell,
  so the pair isolates the effect of the access route. The template for
  plugging in any MCP-speaking agent.
upstream: {repo: null, commit: null, licence: n/a (native to the hub)}
corpus_access: mcp
invocation: self-driving
backend: codex-cli
model: gpt-6-astra, effort high
requires: {commands: [codex]}
network:
  policy: model-api-only
  enforced_by: >-
    codex exec -s read-only and --ignore-user-config; the only MCP server
    configured is the corpus
cost:
  billing: subscription
  provider: openai
  tokens_per_hypothesis: {input: 180000, output: 9000}
  note: assumed equal to codex-solo until measured
